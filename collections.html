<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YL小說網 - 我的收藏</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* 收藏頁面專用樣式 */
        .collections-page {
            padding: 40px 0;
            background-color: #f5f7fa;
            min-height: calc(100vh - 150px);
        }
        
        .collections-header {
            background-color: white;
            padding: 20px 0;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
            margin-bottom: 20px;
        }
        
        .collections-header .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .page-title {
            font-size: 1.8rem;
            color: var(--dark-color);
            margin: 0;
            display: flex;
            align-items: center;
        }
        
        .page-title i {
            margin-right: 10px;
            color: var(--primary-color);
        }
        
        .collections-actions {
            display: flex;
            gap: 10px;
        }
        
        .collections-actions .btn {
            padding: 8px 15px;
            border-radius: 4px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
        }
        
        .btn-sort {
            background-color: white;
            border: 1px solid var(--border-color);
        }
        
        .btn-sort i {
            margin-right: 5px;
        }
        
        .btn-manage {
            background-color: var(--primary-color);
            color: white;
            border: 1px solid var(--primary-color);
        }
        
        .collections-filter {
            background-color: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }
        
        .filter-tabs {
            display: flex;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 15px;
        }
        
        .filter-tab {
            padding: 8px 15px;
            margin-right: 10px;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.3s;
        }
        
        .filter-tab.active {
            border-bottom-color: var(--primary-color);
            color: var(--primary-color);
            font-weight: 500;
        }
        
        .filter-tab:hover:not(.active) {
            border-bottom-color: #ddd;
        }
        
        .collections-content {
            background-color: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }
        
        .collections-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }
        
        .comic-item {
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.3s, box-shadow 0.3s;
            position: relative;
        }
        
        .comic-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        .comic-cover {
            width: 100%;
            height: 280px;
            position: relative;
            overflow: hidden;
        }
        
        .comic-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s;
        }
        
        .comic-item:hover .comic-cover img {
            transform: scale(1.05);
        }
        
        .comic-status {
            position: absolute;
            top: 10px;
            left: 10px;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 3px 8px;
            border-radius: 10px;
            font-size: 0.7rem;
        }
        
        .comic-category {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: var(--primary-color);
            color: white;
            padding: 3px 8px;
            border-radius: 3px;
            font-size: 0.7rem;
        }
        
        .comic-info {
            padding: 15px 10px;
        }
        
        .comic-title {
            font-size: 1rem;
            margin-bottom: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .comic-title a {
            color: var(--dark-color);
            text-decoration: none;
        }
        
        .comic-title a:hover {
            color: var(--primary-color);
        }
        
        .comic-author {
            font-size: 0.8rem;
            color: var(--text-light);
            margin-bottom: 10px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .progress-container {
            margin-bottom: 10px;
        }
        
        .progress-text {
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            margin-bottom: 5px;
            color: var(--text-light);
        }
        
        .progress-bar {
            height: 4px;
            background-color: #eee;
            border-radius: 2px;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background-color: var(--primary-color);
            width: 0%;
            transition: width 0.5s;
        }
        
        .comic-meta {
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            color: var(--text-light);
        }
        
        .comic-actions {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: rgba(0, 0, 0, 0.7);
            display: flex;
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .comic-item:hover .comic-actions {
            opacity: 1;
        }
        
        .comic-action {
            flex: 1;
            text-align: center;
            color: white;
            text-decoration: none;
            font-size: 0.8rem;
            padding: 8px 0;
            transition: background-color 0.3s;
        }
        
        .comic-action:hover {
            background-color: rgba(255, 255, 255, 0.2);
        }
        
        .comic-action i {
            display: block;
            margin-bottom: 3px;
            font-size: 0.9rem;
        }
        
        .empty-collections {
            text-align: center;
            padding: 50px 0;
            grid-column: 1 / -1;
        }
        
        .empty-collections i {
            font-size: 3rem;
            color: var(--border-color);
            margin-bottom: 20px;
        }
        
        .empty-collections h3 {
            color: var(--text-light);
            margin-bottom: 15px;
        }
        
        .btn-discover {
            background-color: var(--primary-color);
            color: white;
            padding: 10px 20px;
            border-radius: 4px;
            text-decoration: none;
            display: inline-block;
        }
        
        .btn-discover:hover {
            background-color: #3a5a9a;
        }
        
        @media (max-width: 992px) {
            .collections-grid {
                grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            }
        }
        
        @media (max-width: 768px) {
            .collections-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            }
            
            .collections-header .container {
                flex-direction: column;
                align-items: flex-start;
            }
            
            .collections-actions {
                margin-top: 15px;
                width: 100%;
                justify-content: flex-end;
            }
            
            .comic-cover {
                height: 220px;
            }
        }
        
        @media (max-width: 576px) {
            .collections-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .comic-cover {
                height: 200px;
            }
        }
    </style>
</head>
<body>
    <!-- 共用頂部導航欄 -->
    <header class="header">
        <div class="container">
            <div class="logo">
                <a href="index.html"><img src="images/logo.jpeg" alt="YL小說網" class="logo-img"></a>
            </div>
            <nav class="main-nav">
                <ul>
                    <li><a href="index.html"><i class="fas fa-home"></i> 首頁</a></li>
                    <li><a href="novels.html"><i class="fas fa-book"></i> 小說</a></li>
                    <li><a href="comics.html"><i class="fas fa-images"></i> 漫畫</a></li>
                    <li class="active"><a href="collections.html"><i class="fas fa-heart"></i> 我的收藏</a></li>
                </ul>
            </nav>
            <div class="user-actions">
                <div class="language-switcher">
                    <span class="current-lang">繁體版</span>
                    <ul class="lang-options">
                        <li><a href="#" data-lang="zh-CN">简体版</a></li>
                        <li><a href="#" data-lang="zh-TW">繁體版</a></li>
                        <li><a href="#" data-lang="en">English</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </header>

    <!-- 收藏頁面主內容 -->
    <main class="collections-page">
        <div class="container">
            <div class="collections-header">
                <div class="container">
                    <h1 class="page-title"><i class="fas fa-heart"></i> 我的收藏</h1>
                    <div class="collections-actions">
                        <button class="btn btn-sort"><i class="fas fa-sort"></i> 排序</button>
                        <button class="btn btn-manage"><i class="fas fa-edit"></i> 管理</button>
                    </div>
                </div>
            </div>
            
            <div class="collections-filter">
                <div class="filter-tabs">
                    <div class="filter-tab active">全部收藏</div>
                    <div class="filter-tab">正在閱讀</div>
                    <div class="filter-tab">已完結</div>
                    <div class="filter-tab">最近更新</div>
                </div>
                <input type="text" class="form-control" placeholder="搜尋收藏中的漫畫...">
            </div>
            
            <div class="collections-content">
                <div class="collections-grid">    
                <!-- 更多漫畫項目... -->
                </div>
                
                <!-- 空收藏狀態 -->
                <!--
                <div class="empty-collections">
                    <i class="fas fa-heart"></i>
                    <h3>您的收藏空空如也</h3>
                    <p>快去發現並收藏您喜歡的漫畫吧！</p>
                    <a href="comics.html" class="btn-discover">探索漫畫</a>
                </div>
                -->
            </div>
        </div>
    </main>

    <!-- 共用頁腳 -->
    <footer class="footer">
        <p>&copy; 2025 YL小說網 版權所有</p>
        <div class="legal-links">
            <a href="#">服務條款</a>
            <a href="#">隱私政策</a>
            <a href="#">版權聲明</a>
        </div>
    </footer>

    <script>
        // 收藏篩選功能
        document.querySelectorAll('.filter-tab').forEach(tab => {
            tab.addEventListener('click', function() {
                document.querySelector('.filter-tab.active').classList.remove('active');
                this.classList.add('active');
                
                // 這裡應該根據選項篩選收藏內容
                console.log('篩選條件:', this.textContent);
            });
        });
        
        // 排序功能
        document.querySelector('.btn-sort').addEventListener('click', function() {
            // 這裡應該顯示排序選項
            console.log('顯示排序選項');
        });
        
        // 管理功能
        document.querySelector('.btn-manage').addEventListener('click', function() {
            // 這裡應該進入管理模式
            console.log('進入管理模式');
            
            // 切換按鈕狀態
            if (this.classList.contains('active')) {
                this.classList.remove('active');
                this.innerHTML = '<i class="fas fa-edit"></i> 管理';
                
                // 移除所有選擇框
                document.querySelectorAll('.comic-select').forEach(select => {
                    select.remove();
                });
            } else {
                this.classList.add('active');
                this.innerHTML = '<i class="fas fa-check"></i> 完成';
                
                // 為每本漫畫添加選擇框
                document.querySelectorAll('.comic-item').forEach(item => {
                    const select = document.createElement('div');
                    select.className = 'comic-select';
                    select.innerHTML = '<input type="checkbox">';
                    select.style.position = 'absolute';
                    select.style.top = '10px';
                    select.style.left = '10px';
                    select.style.zIndex = '10';
                    item.appendChild(select);
                });
            }
        });
        
        // 模擬進度條動畫
        document.querySelectorAll('.progress-fill').forEach(bar => {
            const targetWidth = bar.style.width;
            bar.style.width = '0%';
            setTimeout(() => {
                bar.style.width = targetWidth;
            }, 100);
        });
        
        // 搜尋功能
        document.querySelector('.collections-filter input').addEventListener('input', function() {
            const searchTerm = this.value.toLowerCase();
            const comics = document.querySelectorAll('.comic-item');
            
            comics.forEach(comic => {
                const title = comic.querySelector('.comic-title').textContent.toLowerCase();
                const author = comic.querySelector('.comic-author').textContent.toLowerCase();
                
                if (title.includes(searchTerm) || author.includes(searchTerm)) {
                    comic.style.display = 'block';
                } else {
                    comic.style.display = 'none';
                }
            });
        });
    </script>
</body>

</html>
