<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YL小說網 - 漫畫分類</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <!-- 共用頂部導航欄 -->
    <header class="header">
        <!-- 與首頁相同的導航欄結構 -->
    </header>

    <!-- 主內容區 -->
    <main class="main-content comics-page">
        <!-- 麵包屑導航 -->
        <div class="breadcrumb">
            <div class="container">
                <a href="index.html">首頁</a> &gt; <span>漫畫</span>
            </div>
        </div>

        <!-- 漫畫列表 -->
        <section class="comic-list-section">
            <div class="container">
                <div class="section-header">
                    <h2 class="section-title"><i class="fas fa-images"></i> 漫畫列表</h2>
                </div>
                
                <div class="comic-list">
                    <!-- 漫畫項目1 -->
                    <div class="comic-item" data-category="bl" data-status="ongoing" data-tags="romance,school">
                        <div class="comic-cover">
                            <img src="images/comic1.jpg" alt="《#》">
                            <span class="comic-status ongoing">連載中</span>
                            <div class="comic-category bl">BL</div>
                        </div>
                        <div class="comic-info">
                            <h3 class="comic-title"><a href="#">《#》</a></h3>
                            <p class="comic-author">作者：#</p>
                            <p class="comic-desc">...</p>
                            <div class="comic-tags">
                                <span class="tag">校園</span>
                                <span class="tag">戀愛</span>
                                <span class="tag">搞笑</span>
                            </div>
                        </div>
                    </div>
                    
                    <!-- 漫畫項目2 -->
                    <div class="comic-item" data-category="bg" data-status="completed" data-tags="romance,fantasy,historical">
                        <div class="comic-cover">
                            <img src="images/comic2.jpg" alt="《#》">
                            <span class="comic-status completed">已完結</span>
                            <div class="comic-category bg">BG</div>
                        </div>
                        <div class="comic-info">
                            <h3 class="comic-title"><a href="#">《#》</a></h3>
                            <p class="comic-author">作者：#</p>
                            <p class="comic-desc">...</p>
                            <div class="comic-tags">
                                <span class="tag">古風</span>
                                <span class="tag">奇幻</span>
                                <span class="tag">唯美</span>
                            </div>
                        </div>
                    </div>
                    
                    <!-- 更多漫畫項目... -->
                </div>
                
                <!-- 分頁控制 -->
                <div class="pagination">
                    <a href="#" class="page-nav disabled"><i class="fas fa-chevron-left"></i></a>
                    <a href="#" class="page-num active">1</a>
                    <a href="#" class="page-num">2</a>
                    <a href="#" class="page-num">3</a>
                    <span class="page-dots">...</span>
                    <a href="#" class="page-num">10</a>
                    <a href="#" class="page-nav"><i class="fas fa-chevron-right"></i></a>
                </div>
            </div>
        </section>
    </main>

    <!-- 共用頁腳 -->
    <footer class="footer">
        <p>&copy; 2025 YL小說網 版權所有</p>
                <div class="legal-links">
                    <a href="#">服務條款</a>
                    <a href="#">隱私政策</a>
                    <a href="#">版權聲明</a>
                </div>
    </footer>

    <script src="js/comics.js"></script>
</body>
</html>
