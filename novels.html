<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YL小說網 - 小說分類</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <!-- 共用頂部導航欄 -->
    <header class="header">
        <!-- 與首頁相同的導航欄結構 -->
    </header>

    <!-- 主內容區 -->
    <main class="main-content novels-page">
        <!-- 麵包屑導航 -->
        <div class="breadcrumb">
            <div class="container">
                <a href="index.html">首頁</a> &gt; <span>小說</span>
            </div>
        </div>

        <!-- 小說列表 -->
        <section class="novel-list-section">
            <div class="container">
                <div class="section-header">
                    <h2 class="section-title"><i class="fas fa-book"></i> 小說列表</h2>
                </div>
                
                <div class="novel-list">
                    <!-- 小說項目1 -->
                    <div class="novel-item" data-category="bl" data-status="ongoing" data-tags="romance,sweet,school">
                        <div class="novel-cover">
                            <img src="images/novel1.jpg" alt="《穿書成了下面那個》">
                            <span class="novel-status ongoing">連載中</span>
                            <div class="novel-category bl">BL</div>
                        </div>
                        <div class="novel-info">
                            <h3 class="novel-title"><a href="#">《穿書成了下面那個》</a></h3>
                            <p class="novel-author">作者：淵翎</p>
                            <p class="novel-desc">一個校園學渣居然穿越到了小說？與男二展開一段新的邂逅...</p>
                            <div class="novel-meta">
                                <span><i class="fas fa-eye"></i> 0</span>
                                <span><i class="fas fa-bookmark"></i> 0</span>
                                <span><i class="fas fa-star"></i> 0</span>
                            </div>
                            <div class="novel-tags">
                                <span class="tag">校園</span>
                                <span class="tag">甜寵</span>
                                <span class="tag">萌系</span>
                            </div>
                        </div>
                    </div>
                    
                    <!-- 小說項目2 -->
                    <div class="novel-item" data-category="bg" data-status="completed" data-tags="romance,fantasy,reincarnation">
                        <div class="novel-cover">
                            <img src="images/novel2.jpg" alt="《魔尊的美人師尊》">
                            <span class="novel-status completed">已完結</span>
                            <div class="novel-category bg">BL</div>
                        </div>
                        <div class="novel-info">
                            <h3 class="novel-title"><a href="#">《魔尊的美人師尊》</a></h3>
                            <p class="novel-author">作者：淵翎</p>
                            <p class="novel-desc">清純徒弟？腹黑魔尊？師徒之間的情分變質...</p>
                            <div class="novel-meta">
                                <span><i class="fas fa-eye"></i> 0</span>
                                <span><i class="fas fa-bookmark"></i> 0</span>
                                <span><i class="fas fa-star"></i> 0</span>
                            </div>
                            <div class="novel-tags">
                                <span class="tag">重生</span>
                                <span class="tag">古風</span>
                                <span class="tag">權謀</span>
                            </div>
                        </div>
                    </div>
                    
                    <!-- 更多小說項目... -->
                </div>
                
                <!-- 分頁控制 -->
                <div class="pagination">
                    <a href="#" class="page-nav disabled"><i class="fas fa-chevron-left"></i></a>
                    <a href="#" class="page-num active">1</a>
                    <a href="#" class="page-num">2</a>
                    <a href="#" class="page-num">3</a>
                    <span class="page-dots">...</span>
                    <a href="#" class="page-num">10</a>
                    <a href="#" class="page-nav"><i class="fas fa-chevron-right"></i></a>
                </div>
            </div>
        </section>
    </main>

    <!-- 共用頁腳 -->
    <footer class="footer">
       <p>&copy; 2025 YL小說網 版權所有</p>
       <div class="legal-links">
            <a href="#">服務條款</a>
            <a href="#">隱私政策</a>
            <a href="#">版權聲明</a>
        </div>
    </footer>

    <script src="js/novels.js"></script>
</body>
</html>
